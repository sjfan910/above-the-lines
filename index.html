<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Above the Lines</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Learn-mode study sets for the brothers list and History Sheets #1–4.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://above-the-lines.vercel.app/">
<meta property="og:title" content="Above the Lines">
<meta property="og:description" content="Learn-mode study sets for the brothers list and History Sheets #1–4.">
<meta property="og:image" content="https://above-the-lines.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Above the Lines: history sheets you fill in right where the text sits">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Above the Lines">
<meta name="twitter:image" content="https://above-the-lines.vercel.app/og.png">
<meta name="theme-color" content="#0b1238">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --mid-0:#060a24; --mid-1:#0b1238; --mid-2:#111a4b; --mid-3:#1c2763; --mid-4:#2a3780;
  --electric:#1f8bff; --electric-2:#4cc3ff; --electric-soft:rgba(31,139,255,.16);
  --orange:#ff8a1f; --orange-2:#ffb15c; --orange-soft:rgba(255,138,31,.16);
  --text:#eef2ff; --muted:#9aa6d6; --dim:#6772a8;
  --radius:16px;
}
*{box-sizing:border-box}
html{background:var(--mid-0)}
html,body{margin:0;min-height:100vh}
body{
  font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);
  background:radial-gradient(1200px 600px at 10% -10%,rgba(31,139,255,.18),transparent 60%),
             radial-gradient(900px 500px at 110% 10%,rgba(255,138,31,.10),transparent 60%),
             linear-gradient(180deg,var(--mid-1),var(--mid-0));
  background-attachment:fixed;
}
button{font:inherit;cursor:pointer}
.wrap{max-width:880px;margin:0 auto;padding:24px 20px 64px}
header.top{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--electric),var(--electric-2));font-family:'Space Grotesk';font-weight:700;color:#04102e;font-size:18px;
  box-shadow:0 0 24px rgba(31,139,255,.45)}
.top h1{font-family:'Space Grotesk';font-size:22px;margin:0;letter-spacing:.2px}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.spacer{flex:1}
.btn{border:1px solid var(--mid-4);background:var(--mid-2);color:var(--text);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;transition:.15s}
.btn:hover{border-color:var(--electric);background:var(--mid-3)}
.btn.primary{background:linear-gradient(135deg,var(--electric),#1468e0);border-color:transparent;color:#fff;box-shadow:0 6px 20px rgba(31,139,255,.35)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.orange{background:linear-gradient(135deg,var(--orange),#f06a00);border-color:transparent;color:#1a0b00}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--mid-2)}
.btn.small{padding:7px 12px;font-size:13px}

/* Home */
.hero{background:linear-gradient(135deg,var(--mid-2),var(--mid-3));border:1px solid var(--mid-4);border-radius:20px;padding:22px;margin-bottom:22px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.hero .big{font-family:'Space Grotesk';font-size:40px;font-weight:700;line-height:1;color:var(--electric-2)}
.hero .lbl{color:var(--muted);font-size:13px;margin-top:4px}
.hero .bar{flex:1;min-width:200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.set{position:relative;text-align:left;background:var(--mid-2);border:1px solid var(--mid-3);border-radius:var(--radius);padding:18px;color:var(--text);transition:.18s;overflow:hidden}
.set:hover{transform:translateY(-2px);border-color:var(--electric);box-shadow:0 10px 30px rgba(31,139,255,.18)}
.set .ord{font-family:'Space Grotesk';font-size:13px;color:var(--orange);font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
.set h3{margin:6px 0 4px;font-size:20px;font-family:'Space Grotesk'}
.set .meta{color:var(--muted);font-size:13px;margin-bottom:14px}
.set.all{background:linear-gradient(135deg,#13205e,#0f1846);border-color:var(--electric)}
.set .badge{position:absolute;top:14px;right:14px;font-size:11px;font-weight:700;padding:4px 8px;border-radius:99px;background:var(--orange-soft);color:var(--orange-2)}
.set .badge.done{background:var(--electric-soft);color:var(--electric-2)}
.pbar{height:8px;border-radius:99px;background:var(--mid-0);overflow:hidden;display:flex}
.pbar i{display:block;height:100%}
.pbar .m{background:linear-gradient(90deg,var(--electric),var(--electric-2))}
.pbar .l{background:var(--orange)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend span::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--dim)}
.legend .lm::before{background:var(--electric-2)} .legend .ll::before{background:var(--orange)}
.foot{margin-top:28px;display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:12px;gap:12px;flex-wrap:wrap}

/* Learn */
.lhead{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.lhead .title{font-family:'Space Grotesk';font-weight:700;font-size:18px}
.lhead .round{color:var(--orange);font-size:13px;font-weight:600}
.tabs{display:flex;background:var(--mid-2);border:1px solid var(--mid-3);border-radius:12px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:9px;font-weight:600;font-size:13px}
.tabs button.on{background:var(--mid-4);color:var(--text)}
.progressrow{margin-bottom:18px}
.progressrow .counts{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:6px;border-radius:4px;background:var(--mid-3)}
.segs i.ok{background:var(--electric-2)} .segs i.bad{background:var(--orange)} .segs i.cur{background:var(--mid-4);box-shadow:0 0 0 1px var(--electric) inset}

.card{background:linear-gradient(180deg,var(--mid-2),#0e1642);border:1px solid var(--mid-3);border-radius:22px;padding:26px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.qtop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.qnum{font-family:'Space Grotesk';font-weight:700;font-size:84px;line-height:.9;
  background:linear-gradient(135deg,#fff,var(--electric-2) 60%,var(--electric));-webkit-background-clip:text;background-clip:text;color:transparent}
.qnum small{display:block;white-space:nowrap;font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:var(--orange);-webkit-text-fill-color:var(--orange);margin-bottom:8px;font-family:Inter;font-weight:700}
.qhint{color:var(--muted);font-size:13px;text-align:right}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.wide{grid-column:1/-1}
.field label{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.field label .k{font-family:'Space Grotesk';color:var(--electric-2)}
.field input{width:100%;background:var(--mid-0);border:2px solid var(--mid-3);color:var(--text);border-radius:12px;padding:13px 14px;font-size:16px;font-family:inherit;outline:none;transition:.15s}
.field input:focus{border-color:var(--electric);box-shadow:0 0 0 4px rgba(31,139,255,.18)}
.field input:disabled{opacity:1;color:var(--text);-webkit-text-fill-color:var(--text)}
.field.blank input:disabled{opacity:.55}
.field input::placeholder{color:var(--dim)}
.field.ok input{border-color:var(--electric-2);background:rgba(76,195,255,.08)}
.field.bad input{border-color:var(--orange);background:rgba(255,138,31,.08);text-decoration:line-through;text-decoration-color:rgba(255,138,31,.6)}
.field.close input{border-color:var(--orange-2);background:rgba(255,177,92,.08)}
.field.blank input{border-style:dashed}
.verdict{font-size:13px;display:flex;gap:6px;align-items:flex-start;line-height:1.35}
.verdict b{font-weight:700}
.ok .verdict{color:var(--electric-2)}
.bad .verdict,.close .verdict{color:var(--orange-2)}
.verdict .ans{color:var(--text);font-weight:600}
.actions{display:flex;gap:10px;margin-top:22px;align-items:center;flex-wrap:wrap}
.kbd{font-size:12px;color:var(--dim);margin-left:auto}
.kbd kbd{background:var(--mid-3);border:1px solid var(--mid-4);border-bottom-width:2px;border-radius:6px;padding:1px 6px;font-family:inherit;color:var(--muted)}
.result{margin-top:20px;border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.result.good{background:var(--electric-soft);border:1px solid rgba(76,195,255,.4)}
.result.miss{background:var(--orange-soft);border:1px solid rgba(255,138,31,.4)}
.result .ic{font-size:22px}
.result .t{font-weight:700}
.result .s{font-size:13px;color:var(--muted)}
.extras{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;padding:6px 10px;border-radius:99px;border:1px solid var(--mid-4);background:var(--mid-1);color:var(--muted)}
.chip b{color:var(--text);font-weight:600}
.chip.o{border-color:rgba(255,138,31,.5);color:var(--orange-2)}
.chip.o b{color:var(--orange-2)}

/* summary */
.sum h2{font-family:'Space Grotesk';margin:0 0 6px;font-size:26px}
.sum p{color:var(--muted);margin:0 0 18px}
.list{display:flex;flex-direction:column;gap:8px;margin:16px 0}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--mid-1);border:1px solid var(--mid-3);border-radius:12px;padding:10px 14px}
.row .n{font-family:'Space Grotesk';font-weight:700;font-size:20px;color:var(--electric-2)}
.row .nm{font-weight:600}
.row .sm{font-size:12px;color:var(--muted)}
.lvl{font-size:11px;font-weight:700;padding:4px 8px;border-radius:99px}
.lvl.m{background:var(--electric-soft);color:var(--electric-2)}
.lvl.l{background:var(--orange-soft);color:var(--orange-2)}
.lvl.n{background:var(--mid-3);color:var(--muted)}

/* review table */
.rev{display:flex;flex-direction:column;gap:10px}
.rcard{display:grid;grid-template-columns:56px 1fr;gap:14px;background:var(--mid-2);border:1px solid var(--mid-3);border-radius:14px;padding:14px 16px}
.rcard .n{font-family:'Space Grotesk';font-weight:700;font-size:30px;color:var(--electric-2);line-height:1}
.rcard .nm{font-weight:700;font-size:16px;margin-bottom:4px}
.rcard .ln{font-size:14px;color:#c9d2f5;line-height:1.45}
.rcard .ln span{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.8px;margin-right:6px}
s{text-decoration-color:var(--orange);text-decoration-thickness:2px}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--orange);width:16px;height:16px}

.modal{position:fixed;inset:0;background:rgba(3,6,20,.7);display:grid;place-items:center;padding:20px;z-index:50}
.modal .box{background:var(--mid-2);border:1px solid var(--mid-4);border-radius:18px;padding:22px;max-width:380px;width:100%}
.modal h3{margin:0 0 8px;font-family:'Space Grotesk'}
.modal p{color:var(--muted);margin:0 0 18px;font-size:14px}
.confetti{font-size:56px;line-height:1;margin-bottom:8px}
/* accounts */
.signin{max-width:440px;margin:9vh auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.signin .logo.big{width:64px;height:64px;font-size:26px;border-radius:18px}
.signin h1{font-family:'Space Grotesk';font-size:28px;margin:4px 0 0}
.signin p{color:var(--muted);margin:0;font-size:15px}
.signin form{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:6px}
.signin .duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.signin input{width:100%;background:var(--mid-0);border:2px solid var(--mid-3);color:var(--text);border-radius:12px;padding:14px;font-size:17px;font-family:inherit;outline:none}
.signin input:focus{border-color:var(--electric);box-shadow:0 0 0 4px rgba(31,139,255,.18)}
.btn.wide{width:100%;padding:13px}
.signin .err{min-height:18px;color:var(--orange-2);font-size:13px}
.matches{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:6px}
.btn.match{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;font-size:17px;border-color:var(--electric);background:var(--mid-2)}
.btn.match b{color:var(--electric-2);font-size:14px}
.acct{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:-8px 0 18px;padding:10px 14px;border-radius:12px;background:var(--mid-2);border:1px solid var(--mid-3);font-size:14px;color:var(--muted)}
.acct b{color:var(--text)}
.syncst{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--mid-3);color:var(--muted)}
.syncst::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--dim)}
.syncst.ok{color:var(--electric-2)} .syncst.ok::before{background:var(--electric-2);box-shadow:0 0 8px var(--electric-2)}
.syncst.busy{color:var(--orange-2)} .syncst.busy::before{background:var(--orange)}
.muted{color:var(--muted)}
.atable{display:grid;grid-template-columns:1.3fr .8fr 1fr 2fr auto;gap:10px 14px;align-items:center;background:var(--mid-2);border:1px solid var(--mid-3);border-radius:14px;padding:16px;font-size:14px}
.atable .ah{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--dim)}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--mid-3);color:var(--muted);margin:1px 0}
@media (max-width:620px){ .atable{grid-template-columns:1fr 1fr} .atable .ah{display:none} .signin .duo{grid-template-columns:1fr} }
/* history sheets */
.sechead{display:flex;align-items:baseline;gap:12px;margin:26px 0 12px;flex-wrap:wrap}
.sechead h2{font-family:'Space Grotesk';font-size:20px;margin:0}
.sechead span{color:var(--muted);font-size:13px}
.sheetcard h3{font-size:30px;color:var(--electric-2)}
.shbar{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0 12px;margin-bottom:14px;
  background:linear-gradient(180deg,var(--mid-1) 75%,rgba(11,18,56,0))}
.shbar .btn:disabled{opacity:.45;cursor:default}
.score{font-size:13px;color:var(--muted)} .score b{color:var(--electric-2)}
.shfoot{color:var(--dim);font-size:12px;margin-top:14px;text-align:center}
.shfoot kbd{background:var(--mid-3);border:1px solid var(--mid-4);border-radius:5px;padding:0 5px;color:var(--muted);font-family:inherit}
.paper{background:#fbfbf7;color:#15172e;border-radius:6px;padding:48px 56px 56px;max-width:860px;margin:0 auto;box-shadow:0 24px 60px rgba(0,0,0,.5);
  font-family:'Times New Roman',Times,'Liberation Serif',serif;font-size:17px;line-height:1.5}
.paper.sans{font-family:Arial,Helvetica,'Liberation Sans',sans-serif;font-size:16px}
.s-title{text-align:center;font-size:1.55em;margin-bottom:14px}
.s-h{margin:16px 0 4px}.s-h.tight{margin-top:6px}.s-h.u{text-decoration:underline;text-underline-offset:3px}.s-h.bo{font-weight:700}
.s-gap{height:12px}
.s-p{margin:4px 0 12px}.s-p.ind{text-indent:3.2em}
.s-sub{font-weight:700;margin-top:4px}
.s-li{display:grid;grid-template-columns:1.9em minmax(0,1fr);align-items:baseline;margin:2px 0}
.s-li .tx,.s-ln,.s-kv>span{min-width:0}
.s-li .mk{text-align:left}
.s-ln{margin:2px 0}.it,.s-ln.it{font-style:italic}
.s-kv{display:grid;grid-template-columns:8.5em 1fr;margin:2px 0}
.s-attrib{display:grid;grid-template-columns:auto auto;justify-content:start;column-gap:3em;margin:2px 0}
.s-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:28px;margin:2px 0 6px}
.s-cols > div{min-width:0}
.s-table{border-collapse:collapse;width:88%;margin:0 auto 10px}
.s-table th,.s-table td{border:1px solid #333;padding:2px 6px;text-align:left;font-weight:400}
.s-table th{font-weight:700}
.s-pairs{display:grid;grid-template-columns:1.9em max-content 1fr;row-gap:2px;align-items:baseline}
.s-pairs > span:nth-child(3n+2){padding-right:3.5em}
.s-flag{display:flex;gap:18px;align-items:stretch;margin:4px 0 8px}
.flagsvg{width:210px;height:auto;flex:none}
.flaglabels{display:flex;flex-direction:column;justify-content:space-around}
.paper sup{font-size:.65em}
.blank{font:inherit;font-style:inherit;color:#0b1238;background:rgba(31,139,255,.08);border:0;border-bottom:2px solid #1f8bff;border-radius:4px 4px 0 0;
  padding:0 4px;margin:1px 1px;max-width:100%;outline:none;vertical-align:baseline;line-height:1.35;text-indent:0}
.blank:focus{background:rgba(31,139,255,.18);border-bottom-color:#0b5fd6}
.blank::placeholder{color:#8f97b8;opacity:1}
textarea.blank{display:block;width:100%;resize:none;overflow:hidden;margin:2px 0}
.s-p textarea.blank{display:block;width:100%}
.s-p.ind > textarea.blank:first-child{margin-left:3.2em;width:calc(100% - 3.2em)}
.paper .nw{white-space:nowrap}
.blank.ok{background:rgba(31,139,255,.16);border-bottom-color:#1f8bff;color:#0a3d91}
.blank.close{background:rgba(255,177,92,.22);border-bottom-color:#ffb15c}
.blank.bad{background:rgba(255,138,31,.16);border-bottom-color:#ff8a1f;color:#8a3b00}
.ans{font-family:Inter,sans-serif;font-style:normal;font-size:.74em;font-weight:600;color:#d55f00;margin:0 6px 0 3px;text-indent:0}
.ans.blk{display:block;margin:0 0 6px 2px}
.ans.blk{font-family:inherit;font-size:.9em;font-weight:400;color:#2a2f55;background:rgba(255,138,31,.07);border-left:3px solid #ff8a1f;padding:6px 10px;border-radius:0 6px 6px 0;line-height:1.5}
.ans .dhead{display:block;font-family:Inter,sans-serif;font-size:.8em;font-weight:700;color:#d55f00;margin-bottom:2px}
.ans mark{background:rgba(255,138,31,.28);color:#8a3b00;font-weight:700;border-radius:3px;padding:0 2px}
@media (max-width:620px){
  .paper{padding:24px 16px 30px;font-size:15px}
  .paper.sans{font-size:14.5px}
  .s-cols{grid-template-columns:minmax(0,1fr)}
  .s-p.ind{text-indent:1.5em}
  .s-kv{grid-template-columns:7em 1fr}
  .s-table{width:100%}
  .paper .nw{white-space:normal}
  .s-attrib{grid-template-columns:minmax(0,1fr);row-gap:2px}
  .s-pairs > span:nth-child(3n+2){padding-right:1.2em}
  .flagsvg{width:140px}

  .fields{grid-template-columns:1fr}
  .qnum{font-size:68px}
  .kbd{display:none}
  .wrap{padding:18px 14px 48px}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

}
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j), cur=new Array(n+1);
  for(let i=1;i<=m;i++){ cur[0]=i; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); } [prev,cur]=[cur,prev]; }
  return prev[n];
}
function grade(type, given, answer){
  if(type==='ga'){
    const g=(given||'').replace(/\D/g,''); return g===answer ? 'ok' : 'bad';
  }
  given = (given||'').replace(/~~/g,'');
  const a=norm(answer,prefs.strict), g=norm(given,prefs.strict);
  if(a===g) return 'ok';
  if(!prefs.strict && a.replace(/\s/g,'')===g.replace(/\s/g,'')) return 'ok';
  if(!g) return 'bad';
  const sim = 1 - lev(a,g)/Math.max(a.length,g.length);
  return (sim>=0.85 && a.length>=6) ? 'close' : 'bad';
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pbar(st){ const m=st.m/st.n*100, l=st.l/st.n*100; return `<div class="pbar"><i class="m" style="width:${m}%"></i><i class="l" style="width:${l}%"></i></div>`; }

/* ---------- session ---------- */
let S = null; // {mode, setIdx, pool:[{s,i}], round, queue, pos, results, phase, current grades}

function startSession(mode, setIdx){
  const pool = mode==='all'
    ? SETS.flatMap((st,s)=>st.entries.map((_,i)=>({s,i})))
    : SETS[setIdx].entries.map((_,i)=>({s:setIdx,i}));
  S = {mode, setIdx, pool, round:0, queue:[], pos:0, results:[], phase:'answer', view:'learn'};
  nextRound();
}
function remaining(){ return S.pool.filter(p=>level(p.s,p.i)<2); }
function nextRound(){
  let rem = remaining();
  if(!rem.length){ S.phase='done'; render(); return; }
  if(prefs.order==='shuffle') rem = shuffle(rem);
  if(S.mode==='all') rem = rem.slice(0,10);
  S.round++; S.queue=rem; S.pos=0; S.results=[]; S.phase='answer'; S.grades=null;
  render();
}
function cur(){ const p=S.queue[S.pos]; return {p, e:SETS[p.s].entries[p.i]}; }

function check(giveUp){
  if(S.phase!=='answer') return;
  const {p,e} = cur();
  const grades = {}, given = {};
  fieldsFor(e).forEach(f=>{
    const v = giveUp ? '' : ($('#'+f.key)?.value||'');
    given[f.key]=v; grades[f.key]=grade(f.type,v,f.answer);
  });
  const allOk = Object.values(grades).every(g=>g==='ok');
  S.grades=grades; S.given=given; S.correct=allOk; S.gaveUp=!!giveUp; S.phase='feedback';
  applyResult(allOk);
  render();
}
function applyResult(ok){
  const {p} = cur();
  const before = level(p.s,p.i);
  setLevel(p.s,p.i, ok ? Math.min(2,before+1) : 0);
  S.results[S.pos] = ok;
}
function override(){
  if(S.phase!=='feedback' || S.correct) return;
  const {p} = cur();
  // undo the miss and count as correct
  setLevel(p.s,p.i, Math.min(2,(S.lvBefore||0)+1));
  S.results[S.pos]=true; S.correct=true; S.overridden=true;
  render();
}
function cont(){
  if(S.phase!=='feedback') return;
  S.pos++;
  if(S.pos>=S.queue.length){ S.phase='summary'; render(); return; }
  S.phase='answer'; S.grades=null; S.overridden=false; render();
}

function headerHTML(){
  const title = S.mode==='all' ? 'All sets' : SETS[S.setIdx].label;
  return `<div class="lhead">
    <button class="btn ghost small" id="back">← Sets</button>
    <div class="title">${esc(title)}</div>
    ${S.phase==='answer'||S.phase==='feedback' ? `<div class="round">Round ${S.round}</div>`:''}
    <div class="spacer"></div>
    <div class="tabs">
      <button data-v="learn" class="${S.view==='learn'?'on':''}">Learn</button>
      <button data-v="review" class="${S.view==='review'?'on':''}">Review list</button>
    </div>
  </div>`;
}
function progressHTML(){
  const segs = S.queue.map((_,k)=>{
    if(k<S.results.length && S.results[k]!==undefined) return `<i class="${S.results[k]?'ok':'bad'}"></i>`;
    return `<i class="${k===S.pos?'cur':''}"></i>`;
  }).join('');
  const pool=S.pool, m=pool.filter(p=>level(p.s,p.i)>=2).length, l=pool.filter(p=>level(p.s,p.i)<2&&seen(p.s,p.i)).length;
  return `<div class="progressrow"><div class="segs">${segs}</div>
    <div class="counts"><span>Question ${Math.min(S.pos+1,S.queue.length)} of ${S.queue.length}</span><span><b style="color:var(--electric-2)">${m}</b> mastered · <b style="color:var(--orange-2)">${l}</b> learning · ${pool.length-m-l} new</span></div></div>`;
}
function bindHeader(){
  $('#back').onclick=()=>{ location.hash=''; };
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ S.view=b.dataset.v; render(); });
}

function renderQuestion(){
  const {p,e} = cur();
  const fb = S.phase==='feedback';
  const label = S.mode==='all' ? `${SETS[p.s].label}` : `${SETS[p.s].label}`;
  if(!fb) S.lvBefore = level(p.s,p.i);
  const fds = fieldsFor(e);
  const fields = fds.map((f,k)=>{
    const g = fb ? S.grades[f.key] : '';
    let verdict = '';
    if(fb){
      if(g==='ok') verdict = `<div class="verdict"><b>✓</b> Correct</div>`;
      else if(g==='close') verdict = `<div class="verdict"><b>≈</b><span>Almost — <span class="ans">${answerHTML(f)}</span></span></div>`;
      else verdict = `<div class="verdict"><b>✗</b><span>${S.given[f.key]?'':'No answer · '}<span class="ans">${f.type==='ga'?'ΓΑ ':''}${answerHTML(f)}</span></span></div>`;
    }
    const val = fb ? esc(S.given[f.key]||'') : '';
    return `<div class="field ${f.wide?'wide':''} ${g}">
      <label for="${f.key}"><span class="k">${k+1}</span>${f.label}</label>
      <input id="${f.key}" data-k="${k}" autocomplete="off" autocapitalize="off" spellcheck="false"
        ${f.type==='ga'?'inputmode="numeric"':''}
        placeholder="${fb?'':f.ph}" value="${val}" ${fb?'disabled':''}>
      ${verdict}
    </div>`;
  }).join('');
  const nBox = fds.length;
  const boxWord = nBox===1 ? 'Fill in 1 box' : `Fill in all ${nBox} boxes`;

  let resultBox='', extras='';
  if(fb){
    const lvNow = level(p.s,p.i);
    resultBox = S.correct
      ? `<div class="result good"><div class="ic">⚡</div><div><div class="t">${S.overridden?'Counted as correct':'Nailed it'}</div><div class="s">${lvNow>=2?'Mastered — won’t come up again this set.':'One more correct round to master.'}</div></div></div>`
      : `<div class="result miss"><div class="ic">🔁</div><div><div class="t">${S.gaveUp?'Here’s the answer':'Not quite'}</div><div class="s">This one comes back next round. ${S.gaveUp?'':'Typo only? Use “I was right”.'}</div></div></div>`;
    const ch=[];
    if(e.atl) ch.push(`<span class="chip o">Above the line: <b>${esc(e.atl)}</b></span>`);
    if(e.note) ch.push(`<span class="chip o"><b>${esc(e.note)}</b></span>`);
    if(ch.length) extras = `<div class="extras">${ch.join('')}</div>`;
  }
  const actions = fb
    ? `${!S.correct && !S.gaveUp ? '<button class="btn small" id="ovr">I was right</button>':''}
       <button class="btn primary" id="cont">Continue →</button>
       <span class="kbd"><kbd>Enter</kbd> to continue</span>`
    : `<button class="btn primary" id="chk">Check answer</button>
       <button class="btn ghost" id="dk">Don’t know</button>
       <span class="kbd"><kbd>Enter</kbd> next box · <kbd>Enter</kbd> on last box checks</span>`;

  return `<div class="card">
    <div class="qtop"><div class="qnum"><small>${esc(label)}</small>${p.i+1}</div>
      <div class="qhint">${boxWord}<br><span style="color:var(--dim)">${prefs.strict?'Strict: exact spelling, caps & punctuation':'Caps, punctuation & accents ignored'}</span></div></div>
    <div class="fields">${fields}</div>
    ${resultBox}${extras}
    <div class="actions">${actions}</div>
  </div>`;
}

function renderLearn(){
  let body='';
  if(S.phase==='answer'||S.phase==='feedback'){
    body = progressHTML() + renderQuestion();
  } else if(S.phase==='summary'){
    const rows = S.queue.map((p,k)=>{
      const e=SETS[p.s].entries[p.i], lv=level(p.s,p.i);
      const tag = lv>=2?'<span class="lvl m">Mastered</span>':(S.results[k]?'<span class="lvl l">Familiar</span>':'<span class="lvl l">Still learning</span>');
      return `<div class="row"><div class="n">${p.i+1}</div><div><div class="nm">${esc(e.name)}</div><div class="sm">${S.mode==='all'?esc(SETS[p.s].label)+' · ':''}${S.results[k]?'✓ correct':'✗ missed'}</div></div>${tag}</div>`;
    }).join('');
    const ok = S.results.filter(Boolean).length;
    const rem = remaining().length;
    body = `<div class="card sum"><h2>Round ${S.round} done</h2>
      <p>${ok} / ${S.queue.length} correct this round · ${rem} left to master</p>
      ${progressBlock()}
      <div class="list">${rows}</div>
      <div class="actions"><button class="btn primary" id="nextR">Continue to round ${S.round+1} →</button><span class="kbd"><kbd>Enter</kbd></span></div></div>`;
  } else if(S.phase==='done'){
    const nextSet = S.mode==='set' && S.setIdx<SETS.length-1 ? S.setIdx+1 : null;
    body = `<div class="card sum" style="text-align:center">
      <div class="confetti">🏆</div><h2>${S.mode==='all'?'Every set mastered':esc(SETS[S.setIdx].label)+' mastered'}</h2>
      <p>All ${S.pool.length} answered correctly in two separate rounds.</p>
      <div class="actions" style="justify-content:center">
        <button class="btn" id="again">Study again from scratch</button>
        ${nextSet!==null?`<button class="btn orange" id="nextSet">Next: ${esc(SETS[nextSet].label)} →</button>`:''}
        <button class="btn ghost" id="home">All sets</button>
      </div></div>`;
  }
  return headerHTML() + body;
}
function progressBlock(){
  const pool=S.pool, n=pool.length, m=pool.filter(p=>level(p.s,p.i)>=2).length, l=pool.filter(p=>level(p.s,p.i)<2&&seen(p.s,p.i)).length;
  return `${pbar({n,m,l})}<div class="legend"><span class="lm">${m} mastered</span><span class="ll">${l} learning</span><span>${n-m-l} new</span></div>`;
}

function renderReview(){
  const sets = S.mode==='all' ? SETS.map((_,s)=>s) : [S.setIdx];
  const html = sets.map(s=>`
    ${S.mode==='all'?`<h3 style="font-family:'Space Grotesk';margin:18px 0 10px;color:var(--orange)">${esc(SETS[s].label)}</h3>`:''}
    <div class="rev">${SETS[s].entries.map((e,i)=>`
      <div class="rcard"><div class="n">${i+1}</div><div>
        ${fieldsFor(e).map(f=> f.type==='name'
          ? `<div class="nm">${answerHTML(f)}</div>`
          : `<div class="ln"><span>${f.type==='ga'?'ΓΑ':esc(f.label)}</span>${answerHTML(f)}</div>`).join('')}
        ${e.lines.length===1?`<div class="ln" style="color:var(--dim)">Name only — 1 line</div>`:''}
        ${e.atl||e.note?`<div class="extras">${e.atl?`<span class="chip o">Above the line: <b>${esc(e.atl)}</b></span>`:''}${e.note?`<span class="chip o"><b>${esc(e.note)}</b></span>`:''}</div>`:''}
      </div></div>`).join('')}</div>`).join('');
  return headerHTML() + `
    <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px">
      <label class="toggle"><input type="checkbox" id="optShuffle" ${prefs.order==='shuffle'?'checked':''}> Shuffle question order</label>
      <label class="toggle"><input type="checkbox" id="optStrict" ${prefs.strict?'checked':''}> Strict grading (exact caps & punctuation)</label>
      <span class="spacer"></span>
      <button class="btn small" id="resetSet">Reset ${S.mode==='all'?'all':'this set'}</button>
    </div>` + html;
}

function render(){
  const h = location.hash.replace('#','');
  if(!S){ renderHome(); return; }
  $('#app').innerHTML = S.view==='review' ? renderReview() : renderLearn();
  bindHeader();
  if(S.view==='review'){
    $('#optShuffle').onchange=e=>{ prefs.order=e.target.checked?'shuffle':'order'; save(); };
    $('#optStrict').onchange=e=>{ prefs.strict=e.target.checked; save(); };
    $('#resetSet').onclick=()=>confirmBox('Reset progress?','These cards go back to "new" and Learn restarts at round 1.',()=>{
      S.pool.forEach(p=>delete prog[pid(p.s,p.i)]); save(); const v='learn'; startSession(S.mode,S.setIdx); S.view=v; render(); });
    return;
  }
  if(S.phase==='answer'){
    const inputs=[...document.querySelectorAll('.field input:not(:disabled)')];
    inputs.forEach((inp,k)=>inp.addEventListener('keydown',ev=>{
      if(ev.key==='Enter'){ ev.preventDefault(); ev.stopPropagation(); if(k<inputs.length-1) inputs[k+1].focus(); else check(false); }
    }));
    if(inputs[0]) inputs[0].focus();
    $('#chk').onclick=()=>check(false);
    $('#dk').onclick=()=>check(true);
  } else if(S.phase==='feedback'){
    $('#cont').onclick=cont; $('#cont').focus();
    const o=$('#ovr'); if(o) o.onclick=override;
  } else if(S.phase==='summary'){
    $('#nextR').onclick=nextRound; $('#nextR').focus();
  } else if(S.phase==='done'){
    $('#again').onclick=()=>{ S.pool.forEach(p=>delete prog[pid(p.s,p.i)]); save(); startSession(S.mode,S.setIdx); };
    const ns=$('#nextSet'); if(ns) ns.onclick=()=>{ location.hash='set-'+(S.setIdx+2); };
    $('#home').onclick=()=>{ location.hash=''; };
  }
}

function confirmBox(title,msg,onYes,yesLabel){
  $('#modal').innerHTML=`<div class="modal"><div class="box"><h3>${esc(title)}</h3><p>${esc(msg)}</p>
    <div class="actions" style="margin:0"><button class="btn orange" id="yes">${esc(yesLabel||'Reset')}</button><button class="btn ghost" id="no">Cancel</button></div></div></div>`;
  $('#no').onclick=()=>$('#modal').innerHTML='';
  $('#yes').onclick=()=>{ $('#modal').innerHTML=''; onYes(); };
}

const SH_KEY = 'atl-sheets-v1';
let SHS = { vals:{}, best:{}, mode:'full' };
try{ const r=localStorage.getItem(SH_KEY); if(r) SHS=Object.assign(SHS, JSON.parse(r)); }catch(e){}
function shSave(){ syncMark(); }
let H = null;            // {n, mode, blanks:[{id,ans}], checked, peek}
let shSaveT = null;

function supHTML(s){ return esc(s).replace(/\^([a-z]+)\^/g,'<sup>$1</sup>'); }
function plain(s){ return s.replace(/\^([a-z]+)\^/g,'$1'); }

/* tokenise one line of markup */
function tok(str){
  const out=[]; const re=/\{([^}]*)\}|\[\[(.*?)\]\]|\|/g; let m, last=0;
  while((m=re.exec(str))){
    if(m.index>last) out.push({k:'text', v:str.slice(last,m.index)});
    if(m[1]!==undefined) out.push({k:'key', v:m[1]});
    else if(m[2]!==undefined) out.push({k:'label', v:m[2]});
    else out.push({k:'split'});
    last=re.lastIndex;
  }
  if(last<str.length) out.push({k:'text', v:str.slice(last)});
  return out;
}
function blankHTML(ans){
  const id='b'+H.blanks.length; H.blanks.push({id, ans:plain(ans)});
  const a=plain(ans), long = a.length>58;
  const style = long ? '' : `style="width:calc(${(Math.max(3,a.length)*0.88).toFixed(1)}ch + 14px)"`;
  return long
    ? `<textarea class="blank long" id="${id}" rows="1" spellcheck="false" autocomplete="off"></textarea>`
    : `<input class="blank" id="${id}" ${style} spellcheck="false" autocomplete="off" autocapitalize="off">`;
}
/* render a markup line in the current mode */
function line(str){
  const t=tok(str);
  if(H.mode==='key'){
    // keep a short word before a box and closing punctuation after it on the same line, e.g. "(ΓΑ ____)"
    const s=t.filter(x=>x.k!=='split').map(x=>({k:x.k==='key'?'key':'txt', v:x.v, pre:'', post:''}));
    s.forEach((x,i)=>{
      if(x.k!=='key') return;
      const p=s[i-1], n=s[i+1];
      if(p && p.k==='txt'){ const m=p.v.match(/(\(?ΓΑ ?|\(a |[(“])$/); if(m){ x.pre=m[1]; p.v=p.v.slice(0,-m[1].length); } }
      if(n && n.k==='txt'){ const m=n.v.match(/^[)\].,:;”’]+/); if(m){ x.post=m[0]; n.v=n.v.slice(m[0].length); } }
    });
    return s.map(x=> x.k==='key' ? `<span class="nw">${supHTML(x.pre)}${blankHTML(x.v)}${supHTML(x.post)}</span>` : supHTML(x.v)).join('');
  }
  // full: everything except [[labels]] becomes blanks, split at |
  let html='', buf='';
  const flush=()=>{
    if(!buf) return;
    const lead=buf.match(/^\s*/)[0], trail=buf.match(/\s*$/)[0], core=buf.trim();
    html += esc(lead) + (/[A-Za-z0-9¾ΑΓΔΣΝΚ]/.test(core) ? blankHTML(core) : supHTML(core)) + (core?esc(trail):'');
    buf='';
  };
  t.forEach(x=>{ if(x.k==='label'){ flush(); html+=supHTML(x.v); } else if(x.k==='split') flush(); else buf+=x.v; });
  flush();
  return html;
}
const lvlPad = l => `style="margin-left:${(l||0)*1.6}em"`;
function block(b){
  switch(b.t){
    case 'title': return `<div class="s-title">${esc(b.x)}</div>`;
    case 'h': return `<div class="s-h ${b.u?'u':''} ${b.b?'bo':''} ${b.tight?'tight':''}" ${lvlPad(b.lvl)}>${esc(b.x)}</div>`;
    case 'gap': return `<div class="s-gap"></div>`;
    case 'p': return `<div class="s-p ${b.indent?'ind':''}">${line(b.x)}</div>`;
    case 'sub': return `<div class="s-sub" ${lvlPad(1)}>${line(b.x)}</div>`;
    case 'li': return `<div class="s-li" style="margin-left:${(b.lvl??1)*1.6}em"><span class="mk">${esc(b.m)}</span><span class="tx">${line(b.x)}</span></div>`;
    case 'ln': return `<div class="s-ln ${b.i?'it':''}" ${lvlPad(b.lvl)}>${line(b.x)}</div>`;
    case 'kv': return `<div class="s-kv" ${lvlPad(b.lvl)}><span>${esc(b.k)}</span><span>${line(b.x)}</span></div>`;
    case 'attrib': return `<div class="s-attrib" ${lvlPad(b.lvl)}><span class="it">${line(b.a)}</span><span>${line(b.b)}<br>${line(b.c)}</span></div>`;
    case 'cols': return `<div class="s-cols">${b.c.map(col=>`<div>${col.map(block).join('')}</div>`).join('')}</div>`;
    case 'table': return `<table class="s-table"><thead><tr>${b.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${line(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    case 'pairs': return `<div class="s-pairs" ${lvlPad(b.lvl)}>${b.rows.map(r=>`<span class="mk">•</span><span>${line(r[0])}</span><span>${line(r[1])}</span>`).join('')}</div>`;
    case 'flag': return `<div class="s-flag" ${lvlPad(b.lvl)}>
        <svg viewBox="0 0 220 120" class="flagsvg" aria-label="Sigma Nu flag drawing">
          <rect x="1" y="1" width="218" height="118" fill="#fff" stroke="#333" stroke-width="1.5"/>
          <rect x="1" y="1" width="218" height="38" fill="#3a3a3a"/>
          <line x1="1" y1="79" x2="219" y2="79" stroke="#333" stroke-width="1"/>
          <ellipse cx="110" cy="59" rx="24" ry="15" fill="none" stroke="#333" stroke-width="1.3"/>
          <path d="M117 50 C 108 44, 99 50, 106 55 C 114 60, 118 66, 108 68 C 101 69, 100 64, 106 62" fill="none" stroke="#222" stroke-width="2"/>
        </svg>
        <div class="flaglabels">${b.rows.map(r=>`<div>${line(r)}</div>`).join('')}</div></div>`;
  }
  return '';
}

function shKey(){ return H.n+'-'+H.mode; }
function valKey(){ return shKey()+'-'+H.blanks.length; }
function startSheet(n){
  H = { n, mode:SHS.mode||'full', blanks:[], checked:false, peek:false };
  renderSheet();
}
function renderSheet(){
  const sh = SHEETS[H.n-1];
  H.blanks=[]; H.checked=false;
  const paper = sh.blocks.map(block).join('');
  const best = SHS.best[shKey()];
  $('#app').innerHTML = `
    <div class="lhead">
      <button class="btn ghost small" id="back">← Home</button>
      <div class="title">History Sheets</div>
      <div class="spacer"></div>
      <div class="tabs" id="shtabs">${SHEETS.map(s=>`<button data-n="${s.n}" class="${s.n===H.n?'on':''}">Sheet ${s.n}</button>`).join('')}</div>
    </div>
    <div class="shbar">
      <div class="tabs" id="shmode">
        <button data-m="full" class="${H.mode==='full'?'on':''}">Full sheet</button>
        <button data-m="key" class="${H.mode==='key'?'on':''}">Key facts</button>
      </div>
      <div class="score" id="score">${H.blanks.length} boxes${best!=null?` · best ${Math.round(best*100)}%`:''}</div>
      <div class="spacer"></div>
      <button class="btn small" id="peek">Peek</button>
      <button class="btn small" id="retry" disabled>Retry missed</button>
      <button class="btn small ghost" id="clr">Clear</button>
      <button class="btn small primary" id="chk">Check</button>
    </div>
    <div class="paper ${sh.font==='sans'?'sans':''}">${paper}</div>
    <div class="shfoot">Tip: <kbd>Enter</kbd> jumps to the next box. Caps, punctuation and accents are ignored; ΓΑ can be typed as GA. A small typo counts but is shown (≈).</div>`;
  $('#score').textContent = `${H.blanks.length} boxes` + (best!=null?` · best ${Math.round(best*100)}%`:'');
  // restore saved values
  const saved = SHS.vals[valKey()]||{};
  const els = H.blanks.map(b=>document.getElementById(b.id));
  els.forEach((el,i)=>{
    if(saved[i]) el.value=saved[i];
    autoGrow(el);
    el.addEventListener('input',()=>{ clearMark(i); autoGrow(el); (SHS.vals[valKey()] ||= {})[i]=el.value; clearTimeout(shSaveT); shSaveT=setTimeout(shSave,300); });
    el.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); const nx=els[i+1]; if(nx) nx.focus(); else checkSheet(); } });
  });
  $('#back').onclick=()=>{ location.hash=''; };
  document.querySelectorAll('#shtabs button').forEach(b=>b.onclick=()=>{ location.hash='sheet-'+b.dataset.n; });
  document.querySelectorAll('#shmode button').forEach(b=>b.onclick=()=>{ SHS.mode=b.dataset.m; shSave(); H.mode=b.dataset.m; renderSheet(); });
  $('#chk').onclick=checkSheet;
  $('#peek').onclick=()=>{ H.peek=!H.peek; $('#peek').classList.toggle('orange',H.peek); $('#peek').textContent=H.peek?'Hide peek':'Peek';
    H.blanks.forEach((b,i)=>{ els[i].placeholder = H.peek ? b.ans : ''; autoGrow(els[i]); }); };
  $('#retry').onclick=()=>{ let first=null; H.blanks.forEach((b,i)=>{ const el=els[i]; if(el.classList.contains('bad')){ el.value=''; delete (SHS.vals[valKey()]||{})[i]; clearMark(i); first ||= el; } }); shSave(); $('#retry').disabled=true; if(first) first.focus(); };
  $('#clr').onclick=()=>confirmBox('Clear this sheet?','Removes everything you typed on this sheet in this mode.',()=>{ SHS.vals[valKey()]={}; shSave(); renderSheet(); });
}
function autoGrow(el){ if(el.tagName==='TEXTAREA'){ el.style.height='auto'; el.style.height=el.scrollHeight+'px'; } }
function clearMark(i){
  const el=document.getElementById(H.blanks[i].id); if(!el) return;
  el.classList.remove('ok','bad','close');
  const nx=el.nextElementSibling; if(nx && nx.classList.contains('ans')) nx.remove();
}
function gradeBlank(given, ans){
  const a=norm(ans,false), g=norm(given,false);
  if(!g) return 'bad';
  if(a===g || a.replace(/\s/g,'')===g.replace(/\s/g,'')) return 'ok';
  const sim = 1 - lev(a,g)/Math.max(a.length,g.length);
  const need = a.length>120 ? 0.97 : 0.85;
  return (sim>=need && a.length>=6) ? 'close' : 'bad';
}
/* word diff: answer with wrong/missing words highlighted */
function wordDiffHTML(ans, given){
  const A=ans.split(/\s+/).filter(Boolean), G=given.split(/\s+/).filter(Boolean);
  const na=A.map(w=>norm(w,false)), ng=G.map(w=>norm(w,false));
  const m=na.length, n=ng.length, L=Array.from({length:m+1},()=>new Uint16Array(n+1));
  for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--) L[i][j]= na[i]===ng[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j],L[i][j+1]);
  const hit=new Array(m).fill(false); let i=0,j=0;
  while(i<m&&j<n){ if(na[i]===ng[j]){hit[i]=true;i++;j++;} else if(L[i+1][j]>=L[i][j+1]) i++; else j++; }
  const miss=hit.filter(h=>!h).length;
  return {miss, html:A.map((w,k)=> hit[k]||!na[k] ? esc(w) : `<mark>${esc(w)}</mark>`).join(' ')};
}
function checkSheet(){
  let ok=0;
  H.blanks.forEach((b,i)=>{
    clearMark(i);
    const el=document.getElementById(b.id), g=gradeBlank(el.value,b.ans);
    el.classList.add(g);
    if(g!=='bad') ok++;
    if(g!=='ok'){
      const s=document.createElement('span'); s.className='ans'+(el.tagName==='TEXTAREA'?' blk':'');
      if(el.tagName==='TEXTAREA' && el.value.trim()){
        const d=wordDiffHTML(b.ans, el.value);
        s.innerHTML = `<span class="dhead">${g==='close'?'≈ Almost':'✗'} — ${d.miss} word${d.miss===1?'':'s'} wrong or missing:</span> ${d.html}`;
      } else s.textContent=(g==='close'?'≈ ':'')+b.ans;
      el.after(s);
    }
  });
  const pct=ok/H.blanks.length, k=shKey();
  if(SHS.best[k]==null || pct>SHS.best[k]) SHS.best[k]=pct; shSave();
  $('#score').innerHTML = `<b>${ok} / ${H.blanks.length}</b> correct · ${Math.round(pct*100)}% · best ${Math.round(SHS.best[k]*100)}%`;
  $('#retry').disabled = ok===H.blanks.length;
  const firstBad=document.querySelector('.paper .blank.bad'); if(firstBad) firstBad.scrollIntoView({block:'center',behavior:'smooth'});
}
function sheetCardsHTML(){
  return SHEETS.map(s=>{
    const bf=SHS.best[s.n+'-full'], bk=SHS.best[s.n+'-key'];
    const tag = bf!=null ? `Full ${Math.round(bf*100)}%` : bk!=null ? `Key ${Math.round(bk*100)}%` : 'New';
    return `<button class="set sheetcard" data-sheet="${s.n}">
      <span class="badge ${bf===1?'done':''}">${tag}</span>
      <div class="ord">History Sheet</div><h3>#${s.n}</h3>
      <div class="meta">${esc(s.name)}</div></button>`;
  }).join('');
}

const LOCAL_ONLY = API_TOKEN.startsWith('__');      // preview copies without the API
let USER = null, ENT = {}, LAST = {}, PENDING = {};
let syncState = 'local', pushing = false, pushT = null, signinStep = null;

try{
  USER = JSON.parse(localStorage.getItem(USER_KEY)||'null');
  const s = JSON.parse(localStorage.getItem(SYNC_KEY)||'null');
  if(s){ ENT = s.ent||{}; PENDING = s.pending||{}; }
}catch(e){}

function flatten(){
  const f = {};
  for(const k in prog) f['p:'+k] = prog[k];
  f['prefs'] = prefs;
  for(const k in SHS.vals) if(SHS.vals[k] && Object.keys(SHS.vals[k]).length) f['sv:'+k] = SHS.vals[k];
  for(const k in SHS.best) f['sb:'+k] = SHS.best[k];
  f['smode'] = SHS.mode;
  return f;
}
function applyEntries(){
  prog = {}; SHS.vals = {}; SHS.best = {};
  for(const k in ENT){
    const v = ENT[k].v; if(v==null) continue;
    if(k.startsWith('p:')) prog[k.slice(2)] = v;
    else if(k==='prefs') prefs = Object.assign({order:'order', strict:false}, v);
    else if(k.startsWith('sv:')) SHS.vals[k.slice(3)] = v;
    else if(k.startsWith('sb:')) SHS.best[k.slice(3)] = v;
    else if(k==='smode') SHS.mode = v;
  }
  LAST = {}; const f = flatten(); for(const k in f) LAST[k] = JSON.stringify(f[k]);
}
function persistSync(){ try{ localStorage.setItem(SYNC_KEY, JSON.stringify({ent:ENT, pending:PENDING})); }catch(e){} }
/* record what changed since last time, each with its own timestamp */
function markChanges(){
  const f = flatten(), now = Date.now(); let any = false;
  for(const k in f){ const s = JSON.stringify(f[k]); if(LAST[k]!==s){ ENT[k]={v:f[k], t:now}; PENDING[k]=1; LAST[k]=s; any=true; } }
  for(const k in LAST){ if(!(k in f)){ ENT[k]={v:null, t:now}; PENDING[k]=1; delete LAST[k]; any=true; } }
  if(any) persistSync();
  return any;
}
function syncMark(){ if(markChanges() && USER){ clearTimeout(pushT); pushT = setTimeout(syncNow, 1200); } }

/* first run: bring in progress saved by the older version of the app */
(function migrate(){
  const hasEnt = Object.keys(ENT).length>0;
  if(hasEnt) applyEntries();
  else { const f = flatten(); for(const k in f){ ENT[k]={v:f[k], t:1}; PENDING[k]=1; LAST[k]=JSON.stringify(f[k]); } persistSync(); }
  try{ localStorage.removeItem(STORE_KEY); localStorage.removeItem(SH_KEY); }catch(e){}
})();

async function api(body, opts={}){
  const r = await fetch(API_URL, {method:'POST', keepalive:!!opts.keepalive,
    headers:{'content-type':'application/json', 'x-atl-token':API_TOKEN, ...(opts.admin?{'x-atl-admin':opts.admin}:{})},
    body: JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok){ const e = new Error(j.error||('HTTP '+r.status)); e.status = r.status; throw e; }
  return j;
}
function setSync(s){
  syncState = s;
  const el = document.getElementById('syncst'); if(!el) return;
  const map = {synced:['Synced','ok'], saving:['Saving…','busy'], offline:['Offline — will sync later','off'], local:['This device only','off']};
  const [txt, cls] = map[s]||map.local; el.textContent = txt; el.className = 'syncst '+cls;
}
function mergeRemote(remote){
  let changed = false;
  for(const k in remote){
    const r = remote[k], l = ENT[k];
    if(!l || r.t > l.t){ ENT[k] = r; delete PENDING[k]; changed = true; }
  }
  if(changed){ applyEntries(); persistSync(); }
  return changed;
}
async function syncNow(opts={}){
  if(!USER || LOCAL_ONLY) return;
  if(pushing){ clearTimeout(pushT); pushT = setTimeout(syncNow, 800); return; }
  markChanges();
  const keys = Object.keys(PENDING), entries = {};
  keys.forEach(k=>entries[k]=ENT[k]);
  pushing = true; if(keys.length) setSync('saving');
  try{
    const r = await api({a: keys.length?'push':'pull', id:USER.id, entries}, {keepalive:opts.keepalive});
    keys.forEach(k=>{ if(ENT[k]===entries[k]) delete PENDING[k]; });
    persistSync();
    if(r.name && r.name!==USER.name){ USER.name = r.name; try{ localStorage.setItem(USER_KEY, JSON.stringify(USER)); }catch(e){} }
    if(mergeRemote(r.entries||{})) onRemoteChange();
    setSync('synced');
  }catch(e){
    if(e.status===404){ signOut(true); }
    else setSync('offline');
  }
  pushing = false;
  if(Object.keys(PENDING).length && syncState==='synced'){ clearTimeout(pushT); pushT = setTimeout(syncNow, 1200); }
}
function onRemoteChange(){
  if(signinStep) return;
  if(!S && !H) render();
  else if(H && !(document.activeElement && document.activeElement.classList.contains('blank'))) renderSheet();
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') syncNow(); else syncNow({keepalive:true}); });
window.addEventListener('focus', ()=>syncNow());
setInterval(()=>{ if(document.visibilityState==='visible') syncNow(); }, 20000);

/* ---------- sign in ---------- */
function needSignIn(){ return !LOCAL_ONLY && !USER && !window.__atlLocal; }
function titleCase(s){ s = s.replace(/\s+/g,' ').trim(); return s===s.toLowerCase() ? s.replace(/(^|[\s'-])([a-z])/g,(m,a,b)=>a+b.toUpperCase()) : s; }
function signinShell(inner){
  $('#app').innerHTML = `<div class="signin"><div class="logo big">ΓΑ</div>${inner}</div>`;
}
function renderSignIn(err){
  signinStep = 'name'; S = null; H = null;
  signinShell(`<h1>What’s your name?</h1>
    <p>Your progress saves to your name, so you can pick up on any device.</p>
    <form id="nameForm" autocomplete="off">
      <div class="duo"><input id="fn" placeholder="First name" autocapitalize="words" spellcheck="false">
      <input id="ln" placeholder="Last name" autocapitalize="words" spellcheck="false"></div>
      <button class="btn primary wide" type="submit" id="go2">Continue</button>
      <div class="err">${err?esc(err):''}</div>
    </form>
    <button class="btn ghost small" id="skip">Use without an account</button>`);
  $('#fn').focus();
  $('#nameForm').onsubmit = async ev=>{
    ev.preventDefault();
    const first = titleCase($('#fn').value), last = titleCase($('#ln').value);
    if(!first){ $('#fn').focus(); return; }
    $('#go2').disabled = true; $('#go2').textContent = 'Checking…';
    try{
      const r = await api({a:'find', first, last});
      if(r.matches && r.matches.length) renderMatches(first, last, r.matches);
      else await createAccount(first, last);
    }catch(e){ renderSignIn('Couldn’t reach the server. Check your connection and try again.'); }
  };
  $('#skip').onclick = ()=>{ window.__atlLocal = true; signinStep = null; setSync('local'); route(); };
}
function renderMatches(first, last, matches){
  signinStep = 'match';
  signinShell(`<h1>Is this you?</h1>
    <div class="matches">${matches.map(m=>`<button class="btn match" data-id="${esc(m.id)}" data-name="${esc(m.name)}"><span>${esc(m.name)}</span><b>Yes, that’s me →</b></button>`).join('')}</div>
    <button class="btn wide" id="newacct">No — I’m new, create “${esc((first+' '+last).trim())}”</button>
    <button class="btn ghost small" id="back2">← Change name</button>`);
  document.querySelectorAll('.match').forEach(b=>b.onclick=()=>signInAs({id:b.dataset.id, name:b.dataset.name}));
  $('#newacct').onclick = ()=>createAccount(first, last);
  $('#back2').onclick = ()=>renderSignIn();
}
async function createAccount(first, last){
  try{ const r = await api({a:'create', first, last}); await signInAs({id:r.id, name:r.name}); }
  catch(e){ renderSignIn('Couldn’t create your account. Try again.'); }
}
async function signInAs(u){
  USER = u; try{ localStorage.setItem(USER_KEY, JSON.stringify(USER)); }catch(e){}
  signinShell(`<h1>Welcome${u.name?', '+esc(u.name.split(' ')[0]):''}</h1><p>Loading your progress…</p>`);
  await syncNow();
  signinStep = null; route();
}
async function signOut(silent){
  if(!silent && USER) await syncNow();
  USER = null; ENT = {}; PENDING = {}; LAST = {};
  prog = {}; prefs = {order:'order', strict:false}; SHS = {vals:{}, best:{}, mode:'full'};
  try{ localStorage.removeItem(USER_KEY); localStorage.removeItem(SYNC_KEY); }catch(e){}
  window.__atlLocal = false; location.hash = ''; renderSignIn(silent ? 'That account no longer exists. Enter your name again.' : '');
}
function accountBarHTML(){
  if(LOCAL_ONLY) return '';
  if(!USER) return `<div class="acct"><span class="syncst off" id="syncst">This device only</span><span class="spacer"></span><button class="btn small" id="signinBtn">Sign in to sync</button></div>`;
  return `<div class="acct"><span class="syncst" id="syncst"></span><span>Signed in as <b>${esc(USER.name)}</b></span><span class="spacer"></span><button class="btn small ghost" id="switchBtn">Switch</button></div>`;
}
function bindAccountBar(){
  setSync(USER ? (syncState==='local'?'synced':syncState) : 'local');
  const s = document.getElementById('switchBtn');
  if(s) s.onclick = ()=>confirmBox('Switch account?', `Your progress stays saved to ${USER.name}.`, ()=>signOut(false), 'Switch');
  const si = document.getElementById('signinBtn');
  if(si) si.onclick = ()=>{ window.__atlLocal = false; renderSignIn(); };
}

/* ---------- admin (#admin) ---------- */
async function renderAdmin(){
  S = null; H = null;
  let code = ''; try{ code = sessionStorage.getItem('atl-admin')||''; }catch(e){}
  if(!code){
    $('#app').innerHTML = `<div class="signin"><h1>Admin</h1><form id="adm"><input id="acode" placeholder="Admin code" autocomplete="off" spellcheck="false"><button class="btn primary wide">Open</button><div class="err" id="aerr"></div></form><button class="btn ghost small" id="aback">← Home</button></div>`;
    $('#acode').focus(); $('#aback').onclick=()=>{ location.hash=''; };
    $('#adm').onsubmit = async ev=>{ ev.preventDefault();
      try{ await api({a:'admin'}, {admin:$('#acode').value.trim()}); sessionStorage.setItem('atl-admin', $('#acode').value.trim()); renderAdmin(); }
      catch(e){ $('#aerr').textContent = e.status===403 ? 'Wrong code' : 'Couldn’t reach the server'; } };
    return;
  }
  $('#app').innerHTML = `<div class="lhead"><button class="btn ghost small" id="aback">← Home</button><div class="title">Users</div></div><div id="alist" class="muted">Loading…</div>`;
  $('#aback').onclick=()=>{ location.hash=''; };
  try{
    const r = await api({a:'admin'}, {admin:code});
    const total = SETS.reduce((a,s)=>a+s.entries.length,0);
    const ago = t=>{ const m=Math.round((Date.now()-t)/60000); return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'; };
    $('#alist').innerHTML = r.users.length ? `<div class="atable"><div class="ah">Name</div><div class="ah">Last on</div><div class="ah">Brothers mastered</div><div class="ah">History sheets (best)</div><div class="ah"></div>
      ${r.users.map(u=>`<div><b>${esc(u.name)}</b></div><div>${ago(u.seen)}</div><div>${u.mastered}/${total}${u.learning?` <span class="muted">· ${u.learning} learning</span>`:''}</div>
        <div>${[1,2,3,4].map(n=>{ const v=u.best[n+'-full']??u.best[n+'-key']; return `<span class="pill">#${n} ${v==null?'–':Math.round(v*100)+'%'}</span>`; }).join(' ')}</div>
        <div><button class="btn ghost small" data-rm="${esc(u.id)}" data-nm="${esc(u.name)}">Remove</button></div>`).join('')}</div>
      <p class="muted" style="margin-top:12px">${r.users.length} account${r.users.length===1?'':'s'}</p>` : '<p class="muted">No accounts yet.</p>';
    document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>confirmBox(`Remove ${b.dataset.nm}?`,'Deletes their account and all their progress.',async()=>{ await api({a:'remove', id:b.dataset.rm},{admin:code}); renderAdmin(); },'Remove'));
  }catch(e){ if(e.status===403){ sessionStorage.removeItem('atl-admin'); renderAdmin(); } else $('#alist').textContent='Couldn’t reach the server.'; }
}

/* ---------- routing ---------- */
function route(){
  if(needSignIn()){ if(!signinStep) renderSignIn(); return; }
  if(location.hash==='#admin'){ renderAdmin(); return; }
  const h = location.hash.replace('#','');
  let m = h.match(/^set-(\d+)$/);
  if(m && +m[1]>=1 && +m[1]<=SETS.length){ H=null; startSession('set', +m[1]-1); return; }
  if(h==='all'){ H=null; startSession('all'); return; }
  const ms = h.match(/^sheet-([1-4])$/);
  if(ms){ S=null; startSheet(+ms[1]); window.scrollTo(0,0); return; }
  S=null; H=null; render(); window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
document.addEventListener('keydown', ev=>{
  if(ev.key!=='Enter' || !S || S.view!=='learn') return;
  if(document.activeElement && document.activeElement.tagName==='BUTTON') return; // button handles itself
  if(S.phase==='feedback'){ ev.preventDefault(); cont(); }
  else if(S.phase==='summary'){ ev.preventDefault(); nextRound(); }
});
if(USER) syncNow();
route();
</script>
